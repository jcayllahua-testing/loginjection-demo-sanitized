name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          config-file: remote=jcayllahua-testing/codeql-log-sanitizers@main:codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
